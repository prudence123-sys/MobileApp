<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Culture Trails</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" aria-label="Tourism and culture app">
    <header class="hero">
      <p class="eyebrow">Explore Heritage</p>
      <h1>Culture Trails</h1>
      <p class="subtitle">Discover destinations, traditions, and local experiences in one mobile-friendly app.</p>
    </header>

    <section class="search-panel" aria-label="Search destinations">
      <label for="search-input">Find a destination</label>
      <input id="search-input" type="search" placeholder="Search by place or theme" />
    </section>

    <section>
      <h2>Featured Experiences</h2>
      <div id="experience-list" class="card-list"></div>
      <p id="empty-state" class="empty-state" hidden>No destinations match your search.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
